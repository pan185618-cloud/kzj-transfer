[package]
name = "kuajizhongzhuan"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localsend = { path = "../../app/packages/core", features = ["full"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures-util = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = [] }
hostname = "0.4"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
pem = "4"
reqwest = { version = "0.13.4", features = ["rustls-no-provider", "stream"], default-features = false }
human-sort = "0.2"
open = "5"

[dev-dependencies]
tauri = { version = "2", features = ["devtools"] }

# macOS: vendored wry 0.57.0 + upstream fix (tauri-apps/wry#1844) so folder drops
# publish file URLs via readObjectsForClasses:options: instead of only the
# legacy NSFilenamesPboardType. Windows/Linux resolve wry from crates.io as usual.
[patch.crates-io]
wry = { path = "vendor/wry" }
