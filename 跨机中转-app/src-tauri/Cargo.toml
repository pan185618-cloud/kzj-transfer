[package]
name = "kuajizhongzhuan"
version = "0.1.0"
edition = "2021"

[lib]
name = "kuajizhongzhuan"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "full" without webrtc: the app never uses webrtc-signaling, and the webrtc
# crate is a large dependency tree that does not build for Android.
localsend = { path = "../../app/packages/core", features = ["crypto", "discovery", "http", "multicast"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures-util = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = [] }
hostname = "0.4"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
pem = "4"
reqwest = { version = "0.13.4", features = ["rustls-no-provider", "stream"], default-features = false }
human-sort = "0.2"
open = "5"

# Android: reach ContentResolver for content:// URIs (file picks, SAF), and
# build/model identity. Versions are pinned to what the lockfile already
# resolved for tauri/wry so we link a single copy.
[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.21"
[target.'cfg(target_os = "android")'.dependencies.tracing-subscriber]
version = "0.3"
[target.'cfg(target_os = "android")'.dependencies.ndk-context]
version = "0.1"
# Reach the wry runtime's `dispatch` for JNIEnv access on the Android main
# thread. We already override crates.io wry via [patch.crates-io] to a vendored
# copy, so depending on it here resolves to that same crate.
[target.'cfg(target_os = "android")'.dependencies.wry]
version = "0.57"

# macOS: read file paths off the general pasteboard for paste-to-send.
# Feature set mirrors vendored wry's (Cargo.lock already resolves these).
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"
features = ["exception", "disable-encoding-assertions"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = ["std", "objc2-core-foundation", "NSPasteboard"]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "std",
    "block2",
    "NSArray",
    "NSURL",
    "NSString",
    "NSObject",
]
default-features = false

# Desktop: start a native OS drag session so received files/links can be
# dragged out to Finder/Explorer, WeChat, QQ, other apps.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.drag]
version = "2.1.1"

[dev-dependencies]
tauri = { version = "2", features = ["devtools"] }

# macOS: vendored wry 0.57.0 + upstream fix (tauri-apps/wry#1844) so folder drops
# publish file URLs via readObjectsForClasses:options: instead of only the
# legacy NSFilenamesPboardType. Windows/Linux resolve wry from crates.io as usual.
[patch.crates-io]
wry = { path = "vendor/wry" }
