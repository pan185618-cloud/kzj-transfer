<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>跨机中转</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部:品牌 + 操作 -->
  <header class="toolbar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">跨机中转</span>
        <span id="brand-sub" class="brand-sub">正在搜索设备…</span>
      </span>
    </div>
    <div class="tb-group">
      <button id="btn-discover" class="discover-btn" title="发现设备">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>发现设备</span>
        <span id="discover-count" class="count hidden">0</span>
      </button>
      <button id="btn-open-dir" class="icon-btn desktop-only" title="打开接收目录">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.5 7.5 0 0 0-2.6-1.5L14.2 2.6h-4l-.3 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.5 7.5 0 0 0 2.6 1.5l.3 2.5h4l.3-2.5a7.5 7.5 0 0 0 2.6-1.5l2.3 1 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-compact" class="icon-btn desktop-only" title="收纳到小窗">
        <svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- 分类:全部 / 按设备 / 按类型 -->
  <nav class="views">
    <div class="segmented" role="tablist">
      <button data-view="all" class="seg active">全部</button>
      <button data-view="device" class="seg">按设备</button>
      <button data-view="type" class="seg">按类型</button>
      <span class="seg-thumb"></span>
    </div>
    <div id="sub-device" class="subbar hidden"></div>
    <div id="sub-type" class="subbar hidden">
      <button data-type="image" class="pill active">图片</button>
      <button data-type="file" class="pill">文件</button>
      <button data-type="link" class="pill">链接</button>
      <button data-type="date" class="pill">日期</button>
    </div>
  </nav>

  <!-- 中间:会话区 -->
  <main id="stage">
    <div id="empty-hint" class="empty-hint hidden">
      <div class="empty-art">
        <svg viewBox="0 0 64 64"><rect x="6" y="14" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 42h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="42" y="18" width="16" height="28" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M28 50c6 4 14 4 20-1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 5"/></svg>
      </div>
      <div class="empty-title">还没有内容</div>
      <div id="empty-sub" class="empty-sub">选好目标设备后,输入文字或链接直接发送,点左下角文件夹图标发文件/文件夹</div>
    </div>
    <div id="device-hint" class="empty-hint hidden">
      <div class="empty-art pulse">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="4" fill="currentColor"/><circle cx="32" cy="32" r="13" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".55"/><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".25"/></svg>
      </div>
      <div class="empty-title">还没有发现设备</div>
      <div class="empty-sub">确认两台设备在同一个 Wi-Fi 下,并都打开了跨机中转</div>
      <button id="hint-discover" class="primary-btn">发现设备</button>
    </div>
    <ul id="msg-list" class="msg-list"></ul>
  </main>

  <div id="toasts" class="toasts"></div>

  <!-- 底部:输入框 -->
  <footer id="composer">
    <div id="target" class="target hidden">
      <span class="dot"></span><span>发给</span><b id="target-name"></b>
      <button id="target-change" class="link-btn">切换</button>
    </div>
    <div class="composer-row">
      <button id="btn-attach" class="attach-btn" title="选择文件或文件夹发送">
        <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.6l2 2.2H18a2.5 2.5 0 0 1 2.5 2.5V17a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 17V7.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10.5v6M9 13.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="input-wrap">
        <textarea id="composer-input" rows="1" placeholder="输入文字或链接"></textarea>
      </div>
      <button id="composer-send" class="send-btn" title="发送">
        <svg viewBox="0 0 24 24"><path d="M4.5 12 3 4.5 21 12 3 19.5 4.5 12Zm0 0H11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>发送</span>
      </button>
    </div>
  </footer>

  <!-- 附件菜单 -->
  <div id="attach-menu" class="menu hidden">
    <button id="pick-files" class="menu-item">
      <span class="mi-icon c-blue"><svg viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 3.5V8H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span class="mi-text"><b>选择文件</b><small>照片、视频、文档,可多选</small></span>
    </button>
    <button id="pick-folder" class="menu-item">
      <span class="mi-icon c-amber"><svg viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.6l2 2.2H18a2.5 2.5 0 0 1 2.5 2.5V17a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 17V7.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span class="mi-text"><b>选择文件夹</b><small>连同子文件夹整个发送</small></span>
    </button>
  </div>

  <!-- 发现设备 -->
  <div id="discover-sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h3>发现设备</h3>
        <button id="sheet-close" class="icon-btn" title="关闭">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="section-title">
        <span>自动搜索</span>
        <button id="btn-scan" class="link-btn">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          重新搜索
        </button>
      </div>
      <ul id="dev-list" class="dev-list"></ul>
      <div id="dev-empty" class="dev-empty">
        <span class="radar"></span>正在局域网里搜索…
      </div>

      <div class="section-title"><span>手动连接</span></div>
      <div class="add-ip">
        <input id="ip-input" type="text" inputmode="decimal" placeholder="对方 IP,如 192.168.1.23">
        <button id="btn-add-ip" class="primary-btn">连接</button>
      </div>
      <p class="hint">自动搜索不到时(比如路由器屏蔽了组播),输入对方的局域网 IP 手动连接。</p>
    </div>
  </div>

  <!-- 灵动岛小窗模式 -->
  <div id="island" class="hidden" data-tauri-drag-region>
    <span id="island-status">中转</span>
    <button id="island-expand" title="展开">⤢</button>
  </div>

  <!-- 接收请求弹窗 -->
  <dialog id="receive-dialog">
    <div class="dlg-icon">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3 id="req-title">接收请求</h3>
    <ul id="req-files" class="req-files"></ul>
    <div class="dialog-actions">
      <button id="req-decline" class="ghost-btn">拒绝</button>
      <button id="req-pair" class="ghost-btn">接收并信任</button>
      <button id="req-accept" class="primary-btn">接收</button>
    </div>
  </dialog>

  <!-- 设置弹窗 -->
  <dialog id="settings-dialog">
    <h3>设置</h3>
    <label>设备名 <input id="set-alias" type="text"></label>
    <label class="dest-row">接收目录
      <span class="dest-input">
        <input id="set-dest" type="text">
        <button id="set-browse" class="ghost-btn desktop-only" type="button">浏览…</button>
      </span>
    </label>
    <div class="set-row">
      <span>聊天记录<small>重启后保留,已收到的文件不受影响</small></span>
      <button id="set-clear" class="ghost-btn danger-btn" type="button">清空</button>
    </div>
    <p class="hint">设备名保存后重启应用生效。<br>指纹 <code id="set-fp"></code></p>
    <div class="dialog-actions">
      <button id="set-close" class="ghost-btn">关闭</button>
      <button id="set-save" class="primary-btn">保存</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
